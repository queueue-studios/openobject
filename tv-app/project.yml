# OpenObject Apple TV app — XcodeGen project spec (TVOS-APP-PLAN §7, §14 Phase C).
#
# `xcodegen generate` produces OpenObject.xcodeproj from this YAML; the generated project is ALSO
# committed, so the app builds with only `xcodebuild` (the same "checked-in Xcode project" decision as
# mac-app). Regenerate after editing: `cd tv-app && xcodegen generate`.
#
# A thin tvOS shell over two shared local packages: DisplayCore (../display-core, the headless engine)
# and DisplayUI (../display-ui, the SwiftUI/UIKit art stage). It takes exactly one role, Display (§3):
# it finds a Host on the LAN, the owner picks one, and it renders that Host's rotation full-screen with
# zero chrome. It runs no server and owns no art. The rendering (crossfade, audio, idle/sleep marks)
# lives in DisplayUI's ArtStageCore, shared with the iPad app; tv-app adds only the Siri Remote input
# (the Host picker and the Menu-button exit).

name: OpenObject

options:
  bundleIdPrefix: io.openobject
  deploymentTarget:
    tvOS: "17.0"          # matches DisplayCore's floor (covers every v1 format + modern APIs)
  createIntermediateGroups: true

# The shared Display-role packages, consumed as LOCAL Swift packages (no server, no bundled engine):
# DisplayCore is the headless engine (discovery, rotation, media pipeline, host store); DisplayUI is the
# shared SwiftUI/UIKit art stage. Both are shared with the iPad app.
packages:
  DisplayCore:
    path: ../display-core
  DisplayUI:
    path: ../display-ui

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "NO"
    SWIFT_VERSION: "5.0"         # the UI layer; DisplayCore builds in its own Swift 6 mode
    # The App Store apps run their own version line while they catch up to the platform (player/mac-app/
    # frame are ahead, at 1.7.2); release.sh does NOT bump these, so they are set by hand and tvOS + iOS
    # are always moved TOGETHER so the pair ships matched. 1.6.2 = the tvOS discovery + remembered-Host
    # fixes. Bump CURRENT_PROJECT_VERSION on every upload: App Store Connect rejects a build number it
    # has already seen, even when the marketing version changed.
    MARKETING_VERSION: "1.6.2"
    CURRENT_PROJECT_VERSION: "2"
    # Signed for on-device testing (Phase C6) with the Queueue Studios LLC team (J87JRCN9RM). Automatic
    # signing lets Xcode provision a development profile for a paired Apple TV on the first device build;
    # the simulator still builds ad-hoc ("Sign to Run Locally"). Phase E adds App Store distribution.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: J87JRCN9RM

targets:
  OpenObjectTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - package: DisplayCore
        product: DisplayCore
      - package: DisplayUI
        product: DisplayUI
    info:
      path: OpenObject-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: OpenObject
        NSHumanReadableCopyright: "Copyright 2026 Queueue Studios LLC. All rights reserved."
        # Export compliance, answered declaratively so App Store Connect stops flagging every upload
        # "Missing Compliance" and asking by hand. The app implements no cryptography of its own; it only
        # uses the HTTPS already in the OS (URLSession), which is exempt.
        ITSAppUsesNonExemptEncryption: false
        # Required for Bonjour discovery on device (iOS/tvOS 14+ gate _tcp browsing behind Local Network
        # access + a declared service list); without these a real Apple TV finds no Hosts (§5).
        NSLocalNetworkUsageDescription: "OpenObject finds Hosts on your local network to show their art."
        NSBonjourServices:
          - _openobject._tcp
        # Declares that this app talks to plain HTTP Hosts on the owner's own network, matching
        # ipad-app. It is NOT what makes that work: ATS covers public host names only, and a Host is
        # reached either by an IP literal (HostDiscovery.resolve returns a dotted quad) or by a .local
        # or unqualified name typed into manual entry, none of which ATS evaluates. Verified on the
        # tvOS 26 simulator 2026-08-08: with no ATS key at all, the app loaded /api/display and its
        # media over cleartext from both a LAN IP literal and a .local name. The key is here for
        # intent and durability, not because anything depends on it.
        # Worth knowing if this ever DOES break: NSAllowsLocalNetworking does not cover IP literals,
        # so if a future OS starts blocking cleartext to an IP, this key will not save the discovered-
        # Host path; that would need NSExceptionDomains entries in CIDR notation.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: OpenObject
        # tvOS Brand Assets (layered app icon + Top Shelf) in Assets.xcassets/AppIcon.brandassets. A
        # placeholder that matches the Mac app icon (black OPEN/OBJECT wordmark on white, wordmark ~58.6%
        # of the icon height). ALWAYS regenerate from the canonical ../assets/branding/openobject-logo.svg
        # (render it at high resolution, then downscale to each size) - never enlarge a raster PNG, which
        # fuzzes the edges. Phase D authors the polished parallax layers and Top Shelf art.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Placeholder bundle id: the final one is a §16 open item, chosen with the iPad listing in mind
        # (one App Store record spanning tvOS + iPad). Harmless to change now (local, unsigned).
        PRODUCT_BUNDLE_IDENTIFIER: io.openobject.app
