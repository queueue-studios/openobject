# OpenObject Apple TV app — XcodeGen project spec (TVOS-APP-PLAN §7, §14 Phase C).
#
# `xcodegen generate` produces OpenObject.xcodeproj from this YAML; the generated project is ALSO
# committed, so the app builds with only `xcodebuild` (the same "checked-in Xcode project" decision as
# mac-app). Regenerate after editing: `cd tv-app && xcodegen generate`.
#
# A thin tvOS shell over the shared DisplayCore engine (../display-core). It takes exactly one role,
# Display (§3): it finds a Host on the LAN, the owner picks one, and it renders that Host's rotation
# full-screen with zero chrome. It runs no server and owns no art. C1 is the buildable skeleton; the
# poll/advance driver, art stage, and Host picker arrive in later Phase C checkpoints.

name: OpenObject

options:
  bundleIdPrefix: io.openobject
  deploymentTarget:
    tvOS: "17.0"          # matches DisplayCore's floor (covers every v1 format + modern APIs)
  createIntermediateGroups: true

# The shared Display-role engine, consumed as a LOCAL Swift package (no server, no bundled engine).
packages:
  DisplayCore:
    path: ../display-core

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "NO"
    SWIFT_VERSION: "5.0"         # the UI layer; DisplayCore builds in its own Swift 6 mode
    MARKETING_VERSION: "1.6.0"   # shared version (sourced from player/package.json; release.sh syncs)
    CURRENT_PROJECT_VERSION: "1"
    # Signed for on-device testing (Phase C6) with the Queueue Studios LLC team (J87JRCN9RM). Automatic
    # signing lets Xcode provision a development profile for a paired Apple TV on the first device build;
    # the simulator still builds ad-hoc ("Sign to Run Locally"). Phase E adds App Store distribution.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: J87JRCN9RM

targets:
  OpenObjectTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - package: DisplayCore
        product: DisplayCore
    info:
      path: OpenObject-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: OpenObject
        NSHumanReadableCopyright: "Copyright 2026 Queueue Studios LLC. All rights reserved."
        # Required for Bonjour discovery on device (iOS/tvOS 14+ gate _tcp browsing behind Local Network
        # access + a declared service list); without these a real Apple TV finds no Hosts (§5).
        NSLocalNetworkUsageDescription: "OpenObject finds Hosts on your local network to show their art."
        NSBonjourServices:
          - _openobject._tcp
    settings:
      base:
        PRODUCT_NAME: OpenObject
        # tvOS Brand Assets (layered app icon + Top Shelf) in Assets.xcassets/AppIcon.brandassets. A
        # placeholder that matches the Mac app icon (black OPEN/OBJECT wordmark on white, wordmark ~58.6%
        # of the icon height). ALWAYS regenerate from the canonical ../assets/branding/openobject-logo.svg
        # (render it at high resolution, then downscale to each size) - never enlarge a raster PNG, which
        # fuzzes the edges. Phase D authors the polished parallax layers and Top Shelf art.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Placeholder bundle id: the final one is a §16 open item, chosen with the iPad listing in mind
        # (one App Store record spanning tvOS + iPad). Harmless to change now (local, unsigned).
        PRODUCT_BUNDLE_IDENTIFIER: io.openobject.app
