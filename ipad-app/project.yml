# OpenObject iPad + iPhone app — XcodeGen project spec (TVOS-APP-PLAN §7, §14 Phase G).
#
# `xcodegen generate` produces OpenObject.xcodeproj from this YAML; the generated project is ALSO
# committed, so the app builds with only `xcodebuild` (the same "checked-in Xcode project" decision as
# mac-app and tv-app). Regenerate after editing: `cd ipad-app && xcodegen generate`.
#
# A thin Universal (iPad + iPhone) TOUCH shell over the shared packages: DisplayCore (../display-core,
# the headless engine) and DisplayUI (../display-ui, the SwiftUI/UIKit art stage shared with tv-app). It
# takes exactly one role, Display (§3): it finds a Host on the LAN, the owner picks one, and it renders
# that Host's rotation full-screen with zero chrome. It runs no server and owns no art. G1 is the
# buildable skeleton; the Host picker, art stage, and states arrive in later Phase G checkpoints.

name: OpenObject

options:
  bundleIdPrefix: io.openobject
  deploymentTarget:
    iOS: "17.0"           # matches DisplayCore/DisplayUI's floor (covers every v1 format + modern APIs)
  createIntermediateGroups: true

# The shared Display-role packages, consumed as LOCAL Swift packages (no server, no bundled engine):
# DisplayCore is the headless engine (discovery, rotation, media pipeline, host store); DisplayUI is the
# shared SwiftUI/UIKit art stage. Both are shared with the tvOS app.
packages:
  DisplayCore:
    path: ../display-core
  DisplayUI:
    path: ../display-ui

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "NO"
    SWIFT_VERSION: "5.0"          # the UI layer; DisplayCore builds in its own Swift 6 mode
    MARKETING_VERSION: "1.6.0"    # shared version (sourced from player/package.json; release.sh syncs)
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2" # Universal: 1 = iPhone, 2 = iPad
    # Signed for on-device testing (Phase G5) with the Queueue Studios LLC team (J87JRCN9RM). Automatic
    # signing provisions a development profile for a paired iPad/iPhone on the first device build; the
    # simulator builds ad-hoc ("Sign to Run Locally"). Phase E adds App Store distribution.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: J87JRCN9RM

targets:
  OpenObject:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - package: DisplayCore
        product: DisplayCore
      - package: DisplayUI
        product: DisplayUI
    info:
      path: OpenObject-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: OpenObject
        NSHumanReadableCopyright: "Copyright 2026 Queueue Studios LLC. All rights reserved."
        # Required for Bonjour discovery on device (iOS 14+ gates _tcp browsing behind Local Network
        # access + a declared service list); without these a real iPad/iPhone finds no Hosts (§5).
        NSLocalNetworkUsageDescription: "OpenObject finds Hosts on your local network to show their art."
        NSBonjourServices:
          - _openobject._tcp
        # Hosts serve over plain HTTP on the LAN (the frame and a Mac; no TLS on a home network), so allow
        # local-network HTTP through App Transport Security. NSAllowsLocalNetworking covers .local names and
        # private-range IPs only; it does NOT permit arbitrary public HTTP (a public review Host is HTTPS).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # A launch screen is required for the app to run full-screen at native size on modern iOS. Give it
        # a black background (the LaunchBackground color asset) so an always-dark art app never flashes
        # white before its UI loads (the default would be the system background, i.e. white in Light mode).
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Orientation: the app DECLARES every orientation it ever uses. The Host picker locks itself to
        # landscape at runtime (per-screen, G3); the art stage follows the device (G2). iPad allows all
        # four, iPhone omits upside-down per convention.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: OpenObject
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Placeholder bundle id, shared with the tvOS app so tvOS + iPad/iPhone read as one product
        # (one App Store record, §12); the final id is a §16 open item. Harmless to change now.
        PRODUCT_BUNDLE_IDENTIFIER: io.openobject.app
